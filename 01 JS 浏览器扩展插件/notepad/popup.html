<!DOCTYPE html>  <!-- 声明这是 HTML5 文档 -->
<html lang="zh"> <!-- 页面语言设为中文 -->
    <head>
        <meta charset="UTF-8"> <!-- 字符编码 UTF-8，支持中文显示 -->
        <style>
            /* 重置所有元素的默认边距，统一盒模型 */
            * { margin: 0; padding: 0; box-sizing: border-box; }

            /* 弹窗主体：深色主题，固定宽度 320px */
            body {
                width: 320px;              /* 扩展弹窗的固定宽度 */
                font-family: "Microsoft YaHei", sans-serif;
                background: #1e1e2e;       /* 深夜蓝背景 */
                color: white;
                padding: 16px;             /* 内边距，内容不贴边 */
            }

            /* 标题：浅蓝色，用 flex 让图标和文字对齐 */
            h1 {
                font-size: 16px;
                margin-bottom: 12px;
                color: #cdd6f4;            /* 浅蓝紫色 */
                display: flex;
                align-items: center;       /* 垂直居中，图标和文字对齐 */
                gap: 8px;                  /* 图标和文字之间的间距 */
            }

            /* 笔记输入区域 */
            textarea {
                width: 100%;
                height: 200px;             /* 固定高度，可以看到多行内容 */
                background: #313244;       /* 深灰蓝色背景 */
                color: #cdd6f4;            /* 浅色文字 */
                border: 1px solid #45475a; /* 深色边框 */
                border-radius: 8px;
                padding: 10px;
                font-size: 14px;
                resize: none;              /* 禁止用户手动拖动改变大小 */
                outline: none;             /* 去掉默认的蓝色聚焦边框 */
                line-height: 1.6;          /* 行距，让文字不那么拥挤 */
            }

            /* 聚焦时边框变蓝，提示用户正在输入 */
            textarea:focus { border-color: #89b4fa; }

            /* 底部工具栏：状态文字在左，按钮在右 */
            .toolbar {
                display: flex;
                justify-content: space-between; /* 左右两端对齐 */
                align-items: center;            /* 垂直居中 */
                margin-top: 10px;
            }

            /* 状态文字：小字，灰色 */
            #status {
                font-size: 11px;
                color: #6c7086;            /* 暗灰色，不太显眼 */
            }

            /* 按钮组：清除和保存并排 */
            .buttons { display: flex; gap: 8px; }

            /* 所有按钮的通用样式 */
            button {
                padding: 6px 14px;
                border: none;
                border-radius: 6px;
                font-size: 12px;
                cursor: pointer;
                font-weight: bold;
            }

            /* 保存按钮：蓝色背景，深色文字 */
            #saveBtn {
                background: #89b4fa;   /* 蓝色 */
                color: #1e1e2e;        /* 深色文字，对比度高 */
            }

            /* 清除按钮：深灰色背景，浅色文字 */
            #clearBtn {
                background: #45475a;   /* 深灰色 */
                color: #cdd6f4;        /* 浅色文字 */
            }

            /* 字数统计：右对齐小字，在 textarea 下方 */
            #wordCount {
                font-size: 11px;
                color: #6c7086;
                margin-top: 6px;
                text-align: right;     /* 靠右显示 */
            }
        </style>
    </head>
    <body>
        <!-- 标题 -->
        <h1>📝 快速记事本</h1>

        <!-- 笔记输入框：id 供 popup.js 读取和写入内容 -->
        <textarea id="noteArea" placeholder="在这里输入笔记..."></textarea>

        <!-- 字数统计：由 popup.js 动态更新 -->
        <div id="wordCount">0 个字符</div>

        <!-- 底部工具栏 -->
        <div class="toolbar">
            <!-- 状态文字：由 popup.js 更新，显示"未保存"或"已保存" -->
            <span id="status">已自动保存</span>

            <!-- 按钮组 -->
            <div class="buttons">
                <!-- 清除按钮：点击清空所有笔记 -->
                <button id="clearBtn">清除</button>

                <!-- 保存按钮：点击手动保存 -->
                <button id="saveBtn">保存</button>
            </div>
        </div>

        <!-- popup.js 放在 body 最后，确保 DOM 元素都已加载再执行 JS -->
        <script src="popup.js"></script>
    </body>
</html>
